name: Update GeoData & Natura 2000 Pipeline

on:
  schedule:
    # Draait elk uur automatisch voor verse luchtruim-, NOTAM- en Natura 2000-data
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/n2000_overrides.json"
      - "scripts/update_geodata.py"

permissions:
  contents: write

jobs:
  update-geodata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies (Shapely)
        run: |
          python -m pip install --upgrade pip
          pip install shapely

      - name: Run GeoJSON enrichment & Douglas-Peucker simplification pipeline
        run: |
          python scripts/update_geodata.py

      - name: Commit & push updated GeoJSON files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson data/meta.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in /data/*.geojson"
          else
            git commit -m "chore(data): automatische update geodata & Natura 2000 verrijking [skip ci]"
            git push
          fi
